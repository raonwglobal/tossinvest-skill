name: Fractional Rebalancing Skill Tests

on:
  push:
    paths:
      - "skills/fractional-rebalancing/**"
      - ".github/workflows/fractional-rebalancing-tests.yml"
  pull_request:
    paths:
      - "skills/fractional-rebalancing/**"
      - ".github/workflows/fractional-rebalancing-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run strategy rule tests
        run: python -m unittest discover -s skills/fractional-rebalancing/tests -p "test_*.py"
